services:
  postgres:
    image: postgres:16-alpine
    container_name: harvesto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: harvesto
      POSTGRES_PASSWORD: harvesto
      POSTGRES_DB: harvesto
    ports:
      - "5432:5432"
    volumes:
      - harvesto_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: harvesto-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - harvesto_redis_data:/data

volumes:
  harvesto_pg_data:
  harvesto_redis_data:
